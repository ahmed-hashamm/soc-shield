<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threat Blocked — SOC Shield</title>
  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: rgba(24, 24, 27, 0.5);
      --border-color: rgba(63, 63, 70, 0.4);
      --danger-red: #ef4444;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }
    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.08) 0%, transparent 50%),
        linear-gradient(to bottom, transparent, var(--bg-dark));
    }
    .card {
      max-width: 480px;
      width: 100%;
      padding: 48px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--danger-red);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.2);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 15px;
      margin: 0 0 32px;
    }
    .details {
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 32px;
      text-align: left;
    }
    .details-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71717a;
      margin-bottom: 4px;
    }
    .details-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      color: var(--danger-red);
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--text-main);
      color: var(--bg-dark);
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .btn-secondary:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }
    
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main);
      color: var(--bg-dark);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
        <path d="M12 9v4"/>
        <path d="M12 17h.01"/>
      </svg>
    </div>
    
    <h1>Threat Blocked</h1>
    <p>SOC Shield has prevented a connection to a known malicious domain. This request was intercepted at the network level.</p>
    
    <div class="details">
      <span class="details-label">Target Destination</span>
      <span class="details-value" id="hostname-box">Unknown Domain</span>
    </div>

    <div class="actions">
      <button class="btn-primary" id="safety-btn">Return to Safety</button>
      <button class="btn-secondary" id="proceed-btn">Bypass Block (Admin)</button>
    </div>
  </div>

  <div id="toast">Please add this domain to your dashboard Allowlist to bypass.</div>

  <script src="blocked.js"></script>
</body>
</html>
